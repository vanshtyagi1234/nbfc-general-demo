<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title data-brand-title="{shortName} — Privacy-First {productName}" data-brand-title-configurable>QuickLend — Privacy-First Personal Loans</title>
  <!-- Optional runtime config; absent in dev (inline script seeds an empty default so the
       inline app code falls back to localhost). See config/env.js. -->
  <script>window.DEMO_CONFIG = window.DEMO_CONFIG || {};</script>
  <script src="./config/env.js"></script>
  <script src="./config/brand.js"></script>
  <script src="./js/brand.js"></script>
  <script src="./js/india-states.js"></script>
  <script src="./js/sdk-loader.js" data-load="consent cookie-banner"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Brand colours come from js/brand.js (--brand-*); the fallbacks are the original demo's. */
    :root {
      --navy: var(--brand-secondary, #1A2B5F);
      --navy-deep: var(--brand-secondary-deep, #0f1e42);
      --navy-ring: var(--brand-secondary-ring, #243060);
      --blue: var(--brand-primary, #2563EB);
      --blue-hover: var(--brand-primary-hover, #1d4ed8);
      --blue-rgb: var(--brand-primary-rgb, 37, 99, 235);
      --teal: var(--brand-accent, #0EA5E9);
      --teal-rgb: var(--brand-accent-rgb, 14, 165, 233);
      --gdk: #15803D;
      --danger: #DC2626;
      --bg: var(--brand-tint-bg, #F1F5FE);
      --border: var(--brand-tint-border, #E0E7FF);
      --field: #F3F5F9;
      --text-dark: var(--brand-secondary-deep, #0F1E42);
      --text-muted: #64748B;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      font-family: var(--font);
      background: linear-gradient(165deg, var(--navy-deep), var(--navy));
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: var(--text-dark);
    }

    #wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    /* Journey bar (outside the phone): the demo's milestones */
    #jbar {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    .jstep {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .jdot {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--text-dark);
      border: 2px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.4);
      font-size: 12px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .jlbl {
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      min-width: 44px;
    }

    .jstep.done .jdot { background: var(--gdk); border-color: var(--gdk); color: white; }
    .jstep.done .jlbl { color: var(--gdk); }
    .jstep.active .jdot {
      background: var(--teal);
      border-color: var(--teal);
      color: white;
      box-shadow: 0 0 12px rgba(var(--teal-rgb), 0.6);
    }
    .jstep.active .jlbl { color: var(--teal); font-weight: 600; }

    /* Phone frame */
    #phone {
      width: 330px;
      height: 620px;
      background: #EEF1F6;
      border-radius: 38px;
      box-shadow: 0 0 0 5px var(--navy-deep), 0 0 0 7px var(--navy-ring), 0 20px 50px rgba(0, 0, 0, 0.8);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 18px;
      background: var(--navy-deep);
      border-radius: 0 0 11px 11px;
      z-index: 30;
    }

    #appbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: white;
      padding: 22px 14px 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      min-height: 58px;
      gap: 6px;
    }

    #appbar-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--navy);
      flex: 1;
    }

    #appbar-back {
      background: none;
      border: none;
      color: var(--blue);
      cursor: pointer;
      font-size: 22px;
      padding: 0 6px;
      display: none;
    }

    #appbar-back.visible { display: block; }

    #screen {
      position: relative;
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    #screen::-webkit-scrollbar { width: 4px; }
    #screen::-webkit-scrollbar-thumb { background: rgba(var(--teal-rgb), 0.3); border-radius: 2px; }

    .screen-content {
      padding: 16px 14px 20px;
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }

    .screen-content.centered { justify-content: center; }

    /* Cards */
    .hero-card,
    .form-card,
    .stepper-card {
      background: white;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(15, 30, 66, 0.08);
    }

    .hero-card { padding: 24px 20px; text-align: center; }
    .form-card { padding: 20px 16px; }
    .stepper-card { padding: 14px 16px 16px; margin-bottom: 12px; text-align: center; }

    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      text-align: left;
    }

    .card-title { font-weight: 600; color: var(--navy); margin-bottom: 6px; font-size: 14px; }
    .card-desc { font-size: 13px; color: var(--text-muted); line-height: 1.55; }

    /* Logo */
    [data-brand-logo] { display: flex; justify-content: center; }
    .logo-lg { width: 64px; height: 64px; margin: 0 auto 10px; }
    .logo-md { width: 48px; height: 48px; margin: 0 auto 8px; }
    .brand-logo-img { object-fit: contain; }

    .title { font-size: 21px; font-weight: 700; color: var(--navy); margin-bottom: 6px; }
    .subtitle { font-size: 14px; color: var(--text-muted); line-height: 1.5; margin-bottom: 18px; }

    .feature-list { list-style: none; text-align: left; margin: 0 0 18px; display: grid; gap: 8px; }
    .feature-list li { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--text-dark); }
    .feature-list .tick {
      width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0;
      background: rgba(var(--blue-rgb), 0.12); color: var(--blue);
      display: flex; align-items: center; justify-content: center;
    }

    /* Buttons */
    .btn {
      background: linear-gradient(135deg, var(--blue), var(--blue-hover));
      color: white;
      border: none;
      border-radius: 14px;
      padding: 14px 16px;
      font-family: var(--font);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 8px 18px rgba(var(--blue-rgb), 0.28);
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    }

    .btn:hover { transform: translateY(-1px); box-shadow: 0 10px 22px rgba(var(--blue-rgb), 0.34); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .btn-outline {
      background: white;
      color: var(--blue);
      border: 1px solid var(--border);
      box-shadow: none;
    }

    .btn-outline:hover { background: var(--bg); box-shadow: none; }

    .link-sm {
      background: none;
      border: none;
      color: var(--text-muted);
      font-family: var(--font);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px;
    }

    .link-sm:hover:not(:disabled) { color: var(--blue); text-decoration: underline; }
    .link-sm:disabled { opacity: 0.5; cursor: default; }

    .secure-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 14px auto 0;
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 11px;
      color: var(--text-muted);
      background: #F8FAFC;
    }

    .footer-links { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 12px; color: #CBD5E1; }

    /* Demo customers */
    .label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin: 4px 0 8px; text-align: left; }
    .demo-accounts { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }

    .account-pill {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
    }

    .account-pill:hover { background: white; border-color: var(--teal); }
    .account-pill.selected { background: white; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(var(--blue-rgb), 0.12); }

    .account-avatar {
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--teal); color: white;
      display: flex; align-items: center; justify-content: center;
      font-weight: 600; font-size: 12px; flex-shrink: 0;
    }

    .account-name { font-size: 13px; font-weight: 600; color: var(--navy); }
    .account-phone { font-size: 12px; color: var(--text-muted); }

    /* Phone number field */
    .phone-field { display: flex; gap: 8px; background: var(--field); border-radius: 14px; padding: 5px; border: 1px solid transparent; }
    .phone-field:focus-within { background: white; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(var(--blue-rgb), 0.12); }
    .phone-field.invalid { border-color: var(--danger); }

    .cc {
      display: flex; align-items: center; gap: 6px;
      background: white; border-radius: 10px; padding: 0 10px;
      font-weight: 700; font-size: 14px; color: var(--text-dark);
      box-shadow: 0 1px 3px rgba(15, 30, 66, 0.12);
    }

    .flag { width: 18px; height: 12px; border-radius: 2px; background: linear-gradient(#FF9933 0 33%, #fff 33% 66%, #138808 66%); box-shadow: 0 0 0 1px #e2e8f0; }

    .phone-field input {
      flex: 1; min-width: 0; border: none; background: transparent;
      padding: 10px 6px; font-family: var(--font); font-size: 15px; font-weight: 600; color: var(--text-dark);
      letter-spacing: 0.5px;
    }

    .phone-field input:focus { outline: none; }

    /* OTP */
    .otp-inputs { display: flex; gap: 7px; justify-content: center; margin: 18px 0 10px; }

    .otp-digit {
      width: 38px; height: 46px;
      border: 1px solid transparent; border-radius: 12px;
      background: var(--field);
      text-align: center; font-size: 19px; font-weight: 700; color: var(--blue);
      font-family: var(--font);
      box-shadow: inset 0 1px 2px rgba(15, 30, 66, 0.08);
    }

    .otp-digit:focus { outline: none; background: white; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(var(--blue-rgb), 0.12); }

    .hint { font-size: 12px; color: var(--text-muted); text-align: center; margin-bottom: 10px; }
    .resend-row { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; font-size: 12px; color: var(--text-muted); }
    .timer { border: 1px solid var(--border); border-radius: 8px; padding: 2px 8px; font-weight: 600; color: var(--text-dark); }

    /* In-phone stepper (Step N of 3) */
    .stepper-title { font-size: 18px; font-weight: 700; color: var(--navy); }
    .stepper-sub { font-size: 13px; color: var(--text-muted); margin: 2px 0 12px; }
    .stepper { display: flex; align-items: center; justify-content: center; }

    .sdot {
      width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700;
      background: var(--field); color: #94A3B8;
      box-shadow: inset 0 1px 2px rgba(15, 30, 66, 0.08);
    }

    .sdot.active { background: linear-gradient(135deg, var(--blue), var(--blue-hover)); color: white; box-shadow: 0 0 0 4px rgba(var(--blue-rgb), 0.15); }
    .sdot.done { background: var(--gdk); color: white; }
    .sline { width: 48px; height: 3px; background: var(--field); }
    .sline.done { background: var(--gdk); }

    /* Form */
    .form-title { font-size: 18px; font-weight: 700; color: var(--navy); margin-bottom: 4px; }
    .form-sub { font-size: 13px; color: var(--text-muted); line-height: 1.5; margin-bottom: 14px; }

    .section-title {
      font-size: 15px; font-weight: 700; color: var(--navy);
      border-left: 4px solid var(--blue); padding-left: 8px;
      margin: 18px 0 10px;
    }

    .section-title:first-of-type { margin-top: 4px; }

    .field-label { display: block; font-size: 12px; font-weight: 600; color: #64748B; margin: 10px 0 6px; }
    .field { position: relative; }

    .field .ico {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      width: 16px; height: 16px; color: #94A3B8; pointer-events: none;
    }

    .field .chev {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      width: 16px; height: 16px; color: #64748B; pointer-events: none;
    }

    .field input,
    .field select {
      width: 100%;
      padding: 12px 12px 12px 38px;
      background: var(--field);
      border: 1px solid transparent;
      border-radius: 12px;
      font-family: var(--font);
      font-size: 14px;
      color: var(--text-dark);
      appearance: none;
      -webkit-appearance: none;
    }

    .field select { padding-right: 34px; }
    .field select:disabled { color: #94A3B8; cursor: not-allowed; }
    .field input::placeholder { color: #94A3B8; }

    .field input:focus,
    .field select:focus { outline: none; background: white; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(var(--blue-rgb), 0.12); }

    .field.invalid input,
    .field.invalid select { border-color: var(--danger); background: #FEF2F2; }

    .field-error { min-height: 0; font-size: 11px; color: var(--danger); margin-top: 4px; }
    .field-error:empty { display: none; }
    .center { text-align: center; }

    .choice-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .choice {
      background: var(--field); border: 1px solid transparent; border-radius: 14px;
      padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px;
      cursor: pointer; font-family: var(--font); font-size: 13px; font-weight: 600; color: #64748B;
    }

    .choice .choice-ico {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: #E2E8F0; color: #64748B;
    }

    .choice.selected { background: white; border-color: var(--blue); color: var(--blue); box-shadow: 0 6px 14px rgba(var(--blue-rgb), 0.15); }
    .choice.selected .choice-ico { background: var(--blue); color: white; }
    .choice-row.invalid .choice { border-color: var(--danger); }

    /* Step 2: checks + offer */
    .check-step { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }

    .check-ind {
      width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
      background: var(--field); display: flex; align-items: center; justify-content: center; color: white;
    }

    .check-ind.spinning { border: 3px solid rgba(var(--blue-rgb), 0.2); border-top-color: var(--blue); background: transparent; animation: spin 0.8s linear infinite; }
    .check-ind.done { background: var(--gdk); }
    .check-label { font-size: 13px; font-weight: 500; color: var(--navy); }

    @keyframes spin { to { transform: rotate(360deg); } }

    .offer-hero {
      background: linear-gradient(135deg, var(--blue), var(--navy));
      color: white; border-radius: 18px; padding: 16px; text-align: center; margin-bottom: 12px;
    }

    .offer-hero .lbl { font-size: 12px; opacity: 0.85; }
    .offer-hero .amt { font-size: 28px; font-weight: 800; margin: 2px 0; }
    .offer-hero .note { font-size: 11px; opacity: 0.85; }

    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }

    .chip {
      border: 1px solid var(--border); background: white; color: var(--navy);
      border-radius: 999px; padding: 7px 12px; font-family: var(--font); font-size: 13px; font-weight: 600; cursor: pointer;
    }

    .chip.selected { background: var(--blue); border-color: var(--blue); color: white; }

    .rows { border: 1px solid var(--border); border-radius: 14px; padding: 4px 12px; margin-bottom: 12px; }
    .row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 13px; border-bottom: 1px dashed var(--border); }
    .row:last-child { border-bottom: none; }
    .row span:first-child { color: var(--text-muted); }
    .row span:last-child { font-weight: 600; color: var(--navy); }

    .plan {
      border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px;
      display: flex; gap: 10px; align-items: flex-start; cursor: pointer; text-align: left;
    }

    .plan.selected { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(var(--blue-rgb), 0.12); }
    .plan .radio { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #CBD5E1; margin-top: 2px; flex-shrink: 0; }
    .plan.selected .radio { border-color: var(--blue); background: radial-gradient(var(--blue) 45%, transparent 50%); }
    .plan-name { font-size: 13px; font-weight: 600; color: var(--navy); }
    .plan-desc { font-size: 12px; color: var(--text-muted); }

    /* Step 3 */
    .success-tick {
      width: 64px; height: 64px; border-radius: 50%; background: var(--gdk); color: white;
      display: flex; align-items: center; justify-content: center; margin: 4px auto 10px;
      box-shadow: 0 8px 20px rgba(21, 128, 61, 0.3);
    }

    .app-no { display: inline-block; background: var(--bg); border-radius: 8px; padding: 4px 10px; font-size: 12px; font-weight: 600; color: var(--navy); margin-bottom: 14px; }

    .right-row {
      display: flex; align-items: center; gap: 10px; width: 100%;
      background: none; border: none; border-bottom: 1px solid var(--border);
      padding: 10px 2px; cursor: pointer; text-align: left; font-family: var(--font);
    }

    .right-row:last-child { border-bottom: none; }
    .right-row .r-title { font-size: 13px; font-weight: 600; color: var(--navy); }
    .right-row .r-desc { font-size: 11px; color: var(--text-muted); }
    .right-row .r-ico { width: 30px; height: 30px; border-radius: 8px; background: rgba(var(--blue-rgb), 0.1); color: var(--blue); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

    /* Restart */
    #restart-btn {
      color: var(--teal); background: none; border: none; font-family: var(--font);
      font-size: 14px; cursor: pointer; text-decoration: underline;
    }

    #restart-btn:hover { color: var(--blue); }
  </style>
</head>
<body>
  <div id="wrapper">
    <div id="jbar"></div>
    <div id="phone">
      <div class="notch"></div>
      <div id="appbar">
        <button id="appbar-back" aria-label="Back">←</button>
        <div id="appbar-title"></div>
      </div>
      <div id="screen"></div>
    </div>
    <button id="restart-btn">Restart Demo</button>
  </div>

  <script>
    // ====== Configuration ======
    const __CFG = window.DEMO_CONFIG || {};
    const ORG_ID = __CFG.ORG_ID || "org-quicklend-001";
    const API_BASE = __CFG.API_BASE || "http://localhost:4000/api/v1";
    const CONSENT_UI = __CFG.CONSENT_UI || "http://localhost:3000";
    // Loan figures from config/brand.js (product); see js/brand.js for defaults.
    const PRODUCT = NbfcBrand.product();
    const STATES = window.INDIA_STATES || {};

    // Seeded data principals of the QuickLend org; config/env.js DEMO_ACCOUNTS
    // replaces them for an organisation with its own principals. A number only
    // signs in if it is a data principal of ORG_ID (an unknown number gets a fake
    // "sent" from the API and no code), so the sign-in screen offers these.
    const DEMO_ACCOUNTS = (Array.isArray(__CFG.DEMO_ACCOUNTS) && __CFG.DEMO_ACCOUNTS.length > 0
      ? __CFG.DEMO_ACCOUNTS
      : [
          { name: "Priya Sharma", phone: "+91-9876543210" },
          { name: "Rahul Mehta", phone: "+91-9876543211" },
          { name: "Anjali Patel", phone: "+91-9876543212" }
        ]
    ).map(acc => ({
      name: String(acc.name || ""),
      phone: String(acc.phone || "").replace(/\D/g, "").slice(-10),
      avatar: String(acc.name || "?").trim().charAt(0).toUpperCase()
    }));

    // Config and user values are inserted into HTML strings; escape them first.
    function escapeHtml(text) {
      return NbfcBrand.escape(text);
    }

    // ====== State ======
    function emptyForm() {
      return {
        loanAmount: String(PRODUCT.amount), income: "", salaryDate: "", purpose: "",
        email: "", address: "", state: "", city: "", pin: "",
        employment: "", company: "", officeAddress: ""
      };
    }

    const STATE = {
      currentScreen: "welcome",
      authToken: null,
      principalId: null,
      otpRequestId: null,
      phone: "",
      name: "",
      form: emptyForm(),
      offer: null,
      offerReady: false,
      applicationId: null,
      artifacts: null,
      resendTimer: null
    };

    // ====== Journey ======
    //   welcome → [consent 1: account-registration] → mobile → otp
    //   → application → [consent 2: loan-application-consent] → details (Step 1)
    //   → offer (Step 2) → applied (Step 3) → artifacts
    const ORDER = ["welcome", "mobile", "otp", "application", "details", "offer", "applied", "artifacts"];
    const BACK = { mobile: "welcome", otp: "mobile", details: "application", offer: "details", artifacts: "applied" };

    // Journey bar above the phone: the demo's milestones, and which one each screen is in.
    const MILESTONES = ["Notice", "Sign in", "Consent", "Details", "Offer", "Applied"];
    const MILESTONE_OF = { welcome: 0, mobile: 1, otp: 1, application: 2, details: 3, offer: 4, applied: 5, artifacts: 5 };

      const s = size || 16;

    // "Step N of 3" header shown on the three application steps.
    function stepper(title, step) {
      const dots = [1, 2, 3].map(n => {
        const cls = n < step ? "done" : n === step ? "active" : "";
        const dot = `<div class="sdot ${cls}">${n < step ? icon("check", "", 16) : n}</div>`;
        return n < 3 ? dot + `<div class="sline ${n < step ? "done" : ""}"></div>` : dot;

      return `
        <div class="stepper-card">
          <div class="stepper-title">${title}</div>
          <div class="stepper-sub">Step ${step} of 3</div>

      applied() {

                  ["data-access", "shield", "Access my data", "Download everything we hold (S.11)"],
                  ["preferences", "sliders", "Manage / withdraw consent", "Change any optional purpose (S.6)"],
                  ["grievance", "bell", "File a grievance", "Reach our Grievance Officer (S.13)"],
                  ["nominee", "user", "Register a nominee", "For incapacity or death (S.14)"],
                  ["pwd-guardian", "shield", "Guardianship verification", "Lawful-guardian upload (S.9(3), Rule 11)"],

      artifacts() {

            </div>

    // ====== Navigation ======
    function goTo(screenId) {
      const el = document.getElementById("screen");
      if (STATE.resendTimer) {
        clearInterval(STATE.resendTimer);
        STATE.resendTimer = null;
      }

      // Phase 1: Fade out + slide (no transition yet)
      el.style.transition = "none";
      el.style.opacity = "0";
      el.style.transform = "translateX(16px)";

      setTimeout(() => {
        // Phase 2: Inject new content
        STATE.currentScreen = screenId;
        if (SCREENS[screenId]) {
          el.innerHTML = SCREENS[screenId]();
        }
        el.scrollTop = 0;

        // Phase 3: Enable transition, animate in
        el.style.transition = "opacity 0.25s ease-out, transform 0.25s ease-out";
        el.style.opacity = "1";
        el.style.transform = "translateX(0)";

        // Phase 4: Remove transition after animation
        setTimeout(() => {
          el.style.transition = "none";
        }, 300);

        renderJBar();
        updateAppBar();
        postRender(screenId);
      }, 150);
    }

    function updateAppBar() {
      const brandName = NbfcBrand.get().shortName;
      const titles = {
        welcome: brandName,
        mobile: "Sign in",
        otp: "Verify OTP",
        application: "Loan Application",
        details: "Personal Details",
        offer: "Your Loan Offer",
        applied: "Application Submitted",
        artifacts: "Consent Certificates"
      };
      document.getElementById("appbar-title").textContent = titles[STATE.currentScreen] || brandName;
      document.getElementById("appbar-back").classList.toggle("visible", Boolean(BACK[STATE.currentScreen]));
    }

    function postRender(screenId) {
      if (screenId === "otp") {
        initOTPInputs();
        startResendCountdown();
        setTimeout(() => {
          const firstInput = document.querySelector(".otp-digit");
          if (firstInput) firstInput.focus();
        }, 50);
      }

      if (screenId === "offer" && !STATE.offerReady) {
        startEligibilityChecks();
      }

      if (screenId === "artifacts" && !STATE.artifacts) {
        // Auto-fetch on first entry only. goToArtifactSelection() sets
        // STATE.artifacts and re-enters this screen to render the list —
        // without this guard the flow re-fetches and re-renders forever.
        setTimeout(() => {
          downloadCertificate();
        }, 300);
      }
    }

    function renderJBar() {
      const current = MILESTONE_OF[STATE.currentScreen];
      document.getElementById("jbar").innerHTML = MILESTONES.map((label, i) => {
        const done = i < current;
        const active = i === current;
        return `
          <div class="jstep ${done ? "done" : ""} ${active ? "active" : ""}">
            <div class="jdot">${done ? icon("check", "", 14) : i + 1}</div>
            <div class="jlbl">${label}</div>
          </div>`;
      }).join("");
    }

    // ====== Sign in ======
    function selectAccount(idx) {
      STATE.phone = DEMO_ACCOUNTS[idx].phone;
      STATE.name = DEMO_ACCOUNTS[idx].name;
      const input = document.getElementById("phone-input");
      if (input) input.value = STATE.phone;
      document.querySelectorAll(".account-pill").forEach((el, i) => el.classList.toggle("selected", i === idx));
      showPhoneError("");
    }

    function onPhoneInput(input) {
      input.value = input.value.replace(/\D/g, "").slice(0, 10);
      STATE.phone = input.value;
      const match = DEMO_ACCOUNTS.find(acc => acc.phone === STATE.phone);
      STATE.name = match ? match.name : "";
      document.querySelectorAll(".account-pill").forEach((el, i) => el.classList.toggle("selected", DEMO_ACCOUNTS[i].phone === STATE.phone));
      showPhoneError("");
    }

    function showPhoneError(message) {
      const err = document.getElementById("phone-error");
      if (err) err.textContent = message;
      const wrap = document.getElementById("phone-wrap");
      if (wrap) wrap.classList.toggle("invalid", Boolean(message));
    }

    function startOtpFlow() {
      if (!/^[6-9]\d{9}$/.test(STATE.phone)) {
        showPhoneError("Enter a valid 10-digit mobile number, or choose a demo customer.");
        return;
      }
      // Consent 1 was captured anonymously on the welcome screen (sessionId in
      // localStorage); verifyOTP binds it to the principal with /consent/pending/link.
      sendOTP(false);
    }

    async function sendOTP(isResend) {
      const button = document.getElementById(isResend ? "resend-btn" : "get-otp");
      if (button) button.disabled = true;
      try {
        const response = await fetch(API_BASE + "/auth/otp/send", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ orgId: ORG_ID, phone: "+91" + STATE.phone })
        });
        const data = await response.json().catch(() => ({}));
        if (!data.success) {
          const message = data.error || "Couldn't send the code. Please try again.";
          if (isResend) showOtpError(message); else showPhoneError(message);
          if (button) button.disabled = false;
          return;
        }
        STATE.otpRequestId = data.data.requestId;
        if (isResend) {
          showOtpError("");
          startResendCountdown();
        } else {
          goTo("otp");
        }
      } catch (err) {
        const message = "Couldn't reach the server: " + err.message;
        if (isResend) showOtpError(message); else showPhoneError(message);
        if (button) button.disabled = false;
      }
    }

    function resendOTP() {
      sendOTP(true);
    }

    function startResendCountdown() {
      let left = 30;
      const timer = document.getElementById("resend-timer");
      const button = document.getElementById("resend-btn");
      if (button) button.disabled = true;
      if (STATE.resendTimer) clearInterval(STATE.resendTimer);
      const tick = () => {
        if (timer) timer.textContent = "0:" + String(left).padStart(2, "0");
        if (left <= 0) {
          clearInterval(STATE.resendTimer);
          STATE.resendTimer = null;
          if (button) button.disabled = false;
        }
        left -= 1;
      };
      tick();
      STATE.resendTimer = setInterval(tick, 1000);
    }

    function initOTPInputs() {
      const inputs = document.querySelectorAll(".otp-digit");
      inputs.forEach((input, idx) => {
        input.addEventListener("input", (e) => {
          e.target.value = e.target.value.replace(/\D/g, "").slice(-1);
          if (e.target.value && idx < inputs.length - 1) inputs[idx + 1].focus();
          if (Array.from(inputs).every(i => i.value)) verifyOTP();
        });
        input.addEventListener("keydown", (e) => {
          if (e.key === "Backspace" && !e.target.value && idx > 0) inputs[idx - 1].focus();
          if (e.key === "Enter") verifyOTP();
        });
        input.addEventListener("paste", (e) => {
          const digits = (e.clipboardData || window.clipboardData).getData("text").replace(/\D/g, "").slice(0, 6);
          if (!digits) return;
          e.preventDefault();
          digits.split("").forEach((d, i) => { if (inputs[i]) inputs[i].value = d; });
          (inputs[digits.length] || inputs[inputs.length - 1]).focus();
          if (digits.length === 6) verifyOTP();
        });
      });
    }

    function showOtpError(message) {
      const err = document.getElementById("otp-error");
      if (err) err.textContent = message;
    }

    async function verifyOTP() {
      const inputs = document.querySelectorAll(".otp-digit");
      const otp = Array.from(inputs).map(i => i.value).join("");
      if (otp.length !== 6) {
        showOtpError("Enter all 6 digits.");
        return;
      }
      const button = document.getElementById("verify-btn");
      if (button) {
        if (button.disabled) return;
        button.disabled = true;
      }
      showOtpError("");

      try {
        const response = await fetch(API_BASE + "/auth/otp/verify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ requestId: STATE.otpRequestId, otp })
        });
        const data = await response.json().catch(() => ({}));
        if (!data.success) {
          // The API answers an unknown number with a fake "sent", so a code
          // that fails here may be a wrong code OR a number that is not a data
          // principal of this organisation; say both.
          showOtpError("That code didn't work. Use 123456 with one of the demo customers.");
          inputs.forEach(i => { i.value = ""; });
          inputs[0].focus();
          if (button) button.disabled = false;
          return;
        }

        STATE.authToken = data.data.token;
        STATE.principalId = data.data.principalId;
        if (!STATE.name && data.data.name) STATE.name = data.data.name;

        // Bind the pre-OTP anonymous registration consent (stored against a
        // session id by consent screen 1) to the freshly authenticated
        // principal, then the cookie banner's anonymous choices.
        await linkPendingConsent();
        await linkCookieBannerSession();

        goTo("application");
      } catch (err) {
        showOtpError("Couldn't reach the server: " + err.message);
        if (button) button.disabled = false;
      }
    }

    // Open a consent-ui page (privacy notice, DSAR, preferences, grievance,
    // nominee, pwd-guardian, breaches) in a new tab. The pages ask for an OTP
    // sign-in of their own when they need one.
    function openRights(slug) {
      const url = new URL(CONSENT_UI + "/" + ORG_ID + "/" + slug);
      // Cross-origin bridge: <es-cookie-banner> writes its anonymous session id
      // to THIS page's origin, invisible to consent-ui's own localStorage.
      // Forward it so consent-ui can offer to link the pre-login cookie choices.
      const cookieSessionId = window.__cookieBannerSessionId;
      if (typeof cookieSessionId === "string" && cookieSessionId.length > 0 && cookieSessionId.length <= 128) {
        url.searchParams.set("cookie_session", cookieSessionId);
      }
      window.open(url.toString(), "_blank", "noopener");
    }

    // Re-audit M-14 (2026-09-15) — the host's OWN sign-in must also bind the
    // cookie banner's anonymous choices, or they stay orphaned under the anon
    // id (invisible to My Cookies, DSAR access and erasure). The banner wrote
    // this id to THIS page's own localStorage, so linking it here is a
    // first-party action.
    async function linkCookieBannerSession() {
      const storageKey = "cmp_cookie_session_" + ORG_ID;
      let sessionId = null;
      try { sessionId = localStorage.getItem(storageKey); } catch { /* ignore */ }
      if (!sessionId) return;
      try {
        const res = await fetch(API_BASE + "/consent/cookies/link-session", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + STATE.authToken
          },
          body: JSON.stringify({ orgId: ORG_ID, sessionId })
        });
        if (!res.ok) console.warn("Cookie-session link failed:", res.status);
      } catch (err) {
        console.warn("Cookie-session link error:", err);
      }
    }

    async function linkPendingConsent() {
      const storageKey = "cmp_pending_session_" + ORG_ID;
      let sessionId = null;
      try { sessionId = localStorage.getItem(storageKey); } catch { /* ignore */ }
      if (!sessionId) return;

      try {
        const res = await fetch(API_BASE + "/consent/pending/link", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + STATE.authToken
          },
          body: JSON.stringify({ orgId: ORG_ID, sessionId })
        });
        if (!res.ok) {
          console.warn("Pending-consent link failed:", res.status);
          return;
        }
        try { localStorage.removeItem(storageKey); } catch { /* ignore */ }
      } catch (err) {
        console.warn("Pending-consent link error:", err);
      }
    }

    // ====== Consent screens ======
    function showConsentModal(profileCode) {
      // QuickLend's published profiles; config/env.js PROFILE_CODES overrides
      // individual steps for an organisation whose profiles are named differently.
      const profileMap = Object.assign({
        registration: "account-registration",
        combined: "loan-application-consent"
      }, __CFG.PROFILE_CODES || {});

      const code = profileMap[profileCode] || profileCode;

      if (!customElements.get("es-consent-modal")) {
        alert("Consent screen not available yet. Check your connection and try again.");
        return;
      }

      let modal = document.querySelector("es-consent-modal");
      if (!modal) {
        modal = document.createElement("es-consent-modal");
        document.body.appendChild(modal);
        setupConsentModalListeners(modal);
      }

      modal.setAttribute("org-id", ORG_ID);
      modal.setAttribute("api-base", API_BASE);
      modal.setAttribute("consent-ui-base", CONSENT_UI);
      modal.setAttribute("profile-code", code);

      // WHY: consent-ui stores a token it is handed in its own browser storage
      // and restores it on every later open (up to the token's 24h life). After
      // one signed-in step, the NEXT run's first consent would record straight
      // against the previous person via /consent/grant, never as a pending
      // consent, and revoking the token does not stop it.
      // DECISION: never hand the pop-up the principal token. Every consent records
      // through the anonymous rail (/consent/pending/grant) and the granted /
      // rejected handlers bind it to the signed-in principal with
      // /consent/pending/link, so it shows under Pending, then Linked.
      // TRADEOFF: the after-sign-in consent screen shows "not signed in" and the
      // 18+ self-declaration, like the first one.
      modal.removeAttribute("auth-token");
      modal.removeAttribute("principal-id");

      setTimeout(() => {
        modal.open = true;
        modal.show().catch(err => alert("Error: " + err.message));
      }, 100);
    }

    function setupConsentModalListeners(modal) {
      // Principal accepted → advance (NEXT_SCREEN).
      modal.addEventListener("granted", async (event) => {
        // SDK forwards the anonymous-capture sessionId from the iframe's
        // postMessage payload; cross-origin localStorage is invisible to the
        // host, so the SDK callback is the only bridge. Persist it so
        // linkPendingConsent() finds it.
        const sessionId = event.detail?.sessionId;
        if (typeof sessionId === "string" && sessionId.length > 0 && sessionId.length <= 128) {
          try {
            localStorage.setItem("cmp_pending_session_" + ORG_ID, sessionId);
          } catch (err) {
            // LS quota / private browsing / blocked storage: the pending row
            // stays unbound, so make it debuggable.
            console.warn("[cmp] failed to persist pending sessionId:", err);
          }
        }
        // Signed in already (consent screen 2): bind it now. Before sign-in
        // (consent screen 1) verifyOTP binds it after the code.
        if (STATE.authToken) {
          try { await linkPendingConsent(); } catch (err) { console.warn(err); }
        }
        const nextScreenId = NEXT_SCREEN[STATE.currentScreen];
        if (nextScreenId) setTimeout(() => goTo(nextScreenId), 300);
      });

      // Principal rejected → hold if required purposes were refused (DPDP S.6/S.7:
      // a refusal cannot unlock the next step), else advance as on grant.
      modal.addEventListener("rejected", async (event) => {
        if (event.detail?.hadMandatory) {
          setTimeout(() => {
            alert(
              "To continue, we need your consent for the processing marked " +
              "as required. You can review and grant it by tapping the " +
              "button again, or exit the flow."
            );
          }, 300);
          return;
        }
        if (STATE.authToken) {
          try { await linkPendingConsent(); } catch (err) { console.warn(err); }
        }
        const nextScreenId = NEXT_SCREEN[STATE.currentScreen];
        if (nextScreenId) setTimeout(() => goTo(nextScreenId), 300);
      });

      modal.addEventListener("error", (event) => {
        alert("Error: " + (event.detail?.message || "Unknown error"));
      });
    }

    // ====== Step 1: details ======
    function setField(key, el) {
      STATE.form[key] = el.value.trim();
      clearError(key);
    }

    function setDigits(key, el) {
      el.value = el.value.replace(/\D/g, "");
      STATE.form[key] = el.value;
      clearError(key);
    }

    function setMoney(key, el) {
      const digits = el.value.replace(/\D/g, "").replace(/^0+/, "").slice(0, 9);
      STATE.form[key] = digits;
      el.value = digits ? Number(digits).toLocaleString("en-IN") : "";
      clearError(key);
    }

    function setStateField(key, el) {
      STATE.form.state = el.value;
      STATE.form.city = "";
      clearError("state");
      const cities = STATES[el.value] || [];
      document.getElementById("city-slot").innerHTML =
        selectField("city", "City", "building", cities, { placeholder: "Select city", disabled: !el.value });
    }

    function setEmployment(type) {
      STATE.form.employment = type;
      document.querySelectorAll("#w-employment .choice").forEach((el, i) =>
        el.classList.toggle("selected", (i === 0 ? "salaried" : "self") === type));
      clearError("employment");
    }

    function clearError(key) {
      const err = document.getElementById("err-" + key);
      if (err) err.textContent = "";
      const wrap = document.getElementById("w-" + key);
      if (wrap) wrap.classList.remove("invalid");
    }

    function validateDetails() {
      const f = STATE.form;
      const errors = {};
      const amount = Number(f.loanAmount);
      if (!amount) errors.loanAmount = "Enter the loan amount.";
      else if (amount < PRODUCT.minAmount || amount > PRODUCT.maxAmount) {
        errors.loanAmount = "Choose between " + NbfcBrand.formatInr(PRODUCT.minAmount) +
          " and " + NbfcBrand.formatInr(PRODUCT.maxAmount) + ".";
      }
      if (!Number(f.income)) errors.income = "Enter your monthly income.";
      const day = Number(f.salaryDate);
      if (!(day >= 1 && day <= 31)) errors.salaryDate = "Enter a day between 1 and 31.";
      if (!f.purpose) errors.purpose = "Select a loan purpose.";
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(f.email)) errors.email = "Enter a valid email address.";
      if (f.address.length < 5) errors.address = "Enter your current address.";
      if (!f.state) errors.state = "Select your state.";
      if (!f.city) errors.city = "Select your city.";
      if (!/^[1-9]\d{5}$/.test(f.pin)) errors.pin = "Enter a valid 6-digit PIN code.";
      if (!f.employment) errors.employment = "Choose your employment type.";
      if (f.company.length < 2) errors.company = "Enter your company or business name.";
      if (f.officeAddress.length < 3) errors.officeAddress = "Enter your office address.";
      return errors;
    }

    function submitDetails() {
      const errors = validateDetails();
      Object.keys(STATE.form).forEach(clearError);
      const keys = Object.keys(errors);
      keys.forEach(key => {
        const err = document.getElementById("err-" + key);
        if (err) err.textContent = errors[key];
        const wrap = document.getElementById("w-" + key);
        if (wrap) wrap.classList.add("invalid");
      });
      if (keys.length > 0) {
        const first = document.getElementById("w-" + keys[0]);
        if (first) first.scrollIntoView({ behavior: "smooth", block: "center" });
        return;
      }
      STATE.offer = buildOffer();
      STATE.offerReady = false;
      goTo("offer");
    }

    // ====== Step 2: offer ======
    // Demo eligibility: the requested amount, capped by income x incomeMultiple
    // and the product maximum, rounded down to the slider step.
    function buildOffer() {
      const requested = Number(STATE.form.loanAmount);
      const cap = Math.min(requested, Number(STATE.form.income) * PRODUCT.incomeMultiple, PRODUCT.maxAmount);
      const step = PRODUCT.amountStep;
      const amount = Math.max(PRODUCT.minAmount, Math.floor(cap / step) * step);
      const tenure = PRODUCT.tenureOptions.includes(PRODUCT.tenureMonths) ? PRODUCT.tenureMonths : PRODUCT.tenureOptions[0];
      return { amount, tenure, plan: -1 };
    }

    function processingFee(amount) {
      return Math.round(amount * PRODUCT.processingFeePercent / 100);
    }

    function offerRows() {
      const o = STATE.offer;
      return `
        <div class="row"><span>Interest rate</span><span>${PRODUCT.interestRate}% p.a.</span></div>
        <div class="row"><span>Monthly EMI</span><span>${NbfcBrand.formatInr(NbfcBrand.emiFor(o.amount, o.tenure))}</span></div>
        <div class="row"><span>Processing fee (${PRODUCT.processingFeePercent}%)</span><span>${NbfcBrand.formatInr(processingFee(o.amount))}</span></div>
        <div class="row"><span>Amount credited</span><span>${NbfcBrand.formatInr(o.amount - processingFee(o.amount))}</span></div>`;
    }

    function planCards() {
      const o = STATE.offer;
      const card = (idx, name, desc) => `
        <div class="plan ${o.plan === idx ? "selected" : ""}" onclick="setPlan(${idx})">
          <span class="radio"></span>
          <span><div class="plan-name">${escapeHtml(name)}</div><div class="plan-desc">${escapeHtml(desc)}</div></span>
        </div>`;
      return card(-1, "No protection", "Continue without a plan") +
        PRODUCT.insurancePlans.map((p, i) =>
          card(i, p.name + " · " + NbfcBrand.formatInr(p.monthlyPrice) + "/month", p.features.join(", "))).join("");
    }

    function setTenure(n) {
      STATE.offer.tenure = n;
      document.querySelectorAll(".chip").forEach(el => el.classList.toggle("selected", el.textContent === n + " months"));
      document.getElementById("offer-rows").innerHTML = offerRows();
    }

    function setPlan(idx) {
      STATE.offer.plan = idx;
      document.getElementById("plans").innerHTML = planCards();
    }

    function startEligibilityChecks() {
      [0, 1, 2].forEach(i => {
        setTimeout(() => {
          const ind = document.getElementById("check-" + i);
          if (ind) {
            ind.classList.remove("spinning");
            ind.classList.add("done");
            ind.innerHTML = icon("check", "", 14);
          }
          const next = document.getElementById("check-" + (i + 1));
          if (next) next.classList.add("spinning");
        }, 900 * (i + 1));
      });
      setTimeout(() => {
        if (STATE.currentScreen !== "offer") return;
        STATE.offerReady = true;
        document.getElementById("checks").style.display = "none";
        document.getElementById("offer-body").style.display = "";
      }, 3000);
    }

    function acceptOffer() {
      STATE.applicationId = NbfcBrand.get().shortName.replace(/[^A-Za-z]/g, "").slice(0, 2).toUpperCase() +
        new Date().toISOString().slice(2, 10).replace(/-/g, "") +
        String(Math.floor(1000 + Math.random() * 9000));
      goTo("applied");
    }

    // ====== Consent certificates ======
    async function downloadCertificate() {
      if (!STATE.principalId || !STATE.authToken) {
        alert("Please sign in first");
        goTo("applied");
        return;
      }

      try {
        // Fetch consents for this principal - each consent has an artifact
        const response = await fetch(
          `${API_BASE}/consent/${STATE.principalId}`,
          {
            headers: {
              "Authorization": `Bearer ${STATE.authToken}`,
              "Content-Type": "application/json"
            }
          }
        );

        const data = await response.json();
        if (!data.success) {
          alert("Error fetching certificates: " + (data.error || "Unknown error"));
          goTo("applied");
          return;
        }

        const consents = (data.data?.consents || []).filter(c => c.status === "granted");
        if (consents.length === 0) {
          alert("No granted consents yet.");
          goTo("applied");
          return;
        }

        goToArtifactSelection(consents.map(c => ({
          id: c.consentId,
          name: `${c.purposeName || c.purposeCode} - Consent Artifact`,
          created_at: c.grantedAt,
          type: "HTML"
        })));
      } catch (err) {
        alert("Error: " + err.message);
        goTo("applied");
      }
    }

    async function downloadArtifact(idx) {
      const artifact = STATE.artifacts[idx];
      const fileName = artifact.name + ".html";
      try {
        const response = await fetch(`${API_BASE}/consent/artifact/${artifact.id}/download`, {
          headers: { "Authorization": `Bearer ${STATE.authToken}` }
        });
        if (!response.ok) throw new Error(`Download failed: ${response.statusText}`);
        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);
      } catch (err) {
        alert("Download error: " + err.message);
      }
    }

    function goToArtifactSelection(artifacts) {
      STATE.artifacts = artifacts;
      SCREENS.artifacts = function () {
        return `
          <div class="screen-content">
            <div class="form-card">
              <h3 class="form-title">Consent Certificates</h3>
              <p class="form-sub">Tap a certificate to download it.</p>
              ${artifacts.map((artifact, idx) => `
                <div class="card" onclick="downloadArtifact(${idx})" style="cursor: pointer;">
                  <div class="card-title">${escapeHtml(artifact.name)}</div>
                  <div class="card-desc">Granted ${artifact.created_at ? new Date(artifact.created_at).toLocaleDateString() : "—"}</div>
                </div>`).join("")}
              <button class="btn btn-outline" onclick="goTo('applied')">Back to application</button>
            </div>
          </div>`;
      };
      goTo("artifacts");
    }

    // ====== Restart ======
    function restart() {
      // Revoke the principal session server-side before dropping the token
      // (migration 411). `keepalive` keeps the request alive while goTo()
      // re-renders, so the reset is a real sign-out.
      if (STATE.authToken) {
        try {
          fetch(API_BASE + "/auth/principal/logout", {
            method: "POST",
            keepalive: true,
            headers: { "Authorization": "Bearer " + STATE.authToken }
          }).catch(function () { /* best-effort: local reset proceeds regardless */ });
        } catch (err) {
          console.warn("[demo] principal logout failed:", err);
        }
      }
      Object.assign(STATE, {
        authToken: null, principalId: null, otpRequestId: null, phone: "", name: "",
        form: emptyForm(), offer: null, offerReady: false, applicationId: null, artifacts: null
      });
      delete SCREENS.artifacts;
      SCREENS.artifacts = SCREENS_ARTIFACTS_PLACEHOLDER;
      goTo("welcome");
    }

    const SCREENS_ARTIFACTS_PLACEHOLDER = SCREENS.artifacts;

    // ====== Back / Restart buttons ======
    document.getElementById("appbar-back").addEventListener("click", () => {
      const prev = BACK[STATE.currentScreen];
      if (prev) goTo(prev);
    });
    document.getElementById("restart-btn").addEventListener("click", restart);

    // ====== Init ======
    // The org's branding arrives asynchronously; data-brand-* nodes refresh
    // themselves, the app bar title is rebuilt here.
    window.addEventListener("nbfc:brand", updateAppBar);
    goTo("welcome");
  </script>

  <!-- ====== Cookie consent banner (DPDP S.6 / S.7) ======
       Drop-in <es-cookie-banner> Web Component, loaded by js/sdk-loader.js in
       <head>. The banner auto-fetches /public/:orgId/cookies/banner.json and
       themes from the org's primaryColor, so no per-page CSS. -->
  <script>
    (function () {
      var cfg = window.DEMO_CONFIG || {};
      var orgId = cfg.ORG_ID || "org-quicklend-001";
      var apiBase = cfg.API_BASE || "http://localhost:4000/api/v1";
      var banner = document.createElement("es-cookie-banner");
      banner.setAttribute("org-id", orgId);
      banner.setAttribute("api-base", apiBase);
      // Cross-origin bridge: capture the sessionId for forwarding as the
      // `cookie_session` query param on the next consent-ui navigation.
      // consent-ui never auto-links a query-param id; the principal confirms.
      function captureBannerSessionId(sessionId) {
        if (typeof sessionId !== "string" || sessionId.length === 0) return;
        window.__cookieBannerSessionId = sessionId;
      }
      banner.addEventListener("granted", function (e) {
        captureBannerSessionId(e.detail && e.detail.sessionId);
      });
      banner.addEventListener("withdrawn", function (e) {
        captureBannerSessionId(e.detail && e.detail.sessionId);
      });
      document.body.appendChild(banner);
      // Returning visitor whose decision is still fresh: the banner emits only
      // `ready`, so seed from the SDK's own localStorage write.
      try {
        var storedSessionId = window.localStorage.getItem("cmp_cookie_session_" + orgId);
        if (storedSessionId) captureBannerSessionId(storedSessionId);
      } catch (e) { /* private browsing / blocked storage */ }
    })();
  </script>
</body>
</html>
